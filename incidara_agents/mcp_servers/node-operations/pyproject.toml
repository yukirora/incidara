[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "node-operations"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pexpect>=4.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
db = [
    "ltp-storage-common",
    "ltp-postgresql-sdk",
]
mcp = ["fastmcp>=3.0.0"]
dev = ["pytest>=7.0.0"]
all = ["node-operations[db,mcp,dev]"]

[tool.setuptools.packages.find]
include = ["node_operations*"]

[tool.setuptools.package-data]
"*" = ["bundles/**/*"]
