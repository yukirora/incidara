services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incidara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: incidara
    volumes:
      - incidara-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidara -d incidara"]
      interval: 5s
      timeout: 5s
      retries: 10

  console:
    build: ./console
    environment:
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?copy .env.example to .env and set SESSION_SECRET}
      CHAT_UI_DATABASE_URL: postgresql://incidara:${POSTGRES_PASSWORD}@db:5432/incidara
      AGENTS_CONFIG_PATH: /app/config/agents.yaml
      GROUPS_CONFIG_PATH: /app/config/groups.yaml
    volumes:
      - ./console/config/agents.yaml.example:/app/config/agents.yaml:ro
      - ./console/config/groups.yaml.example:/app/config/groups.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-3001}:3001"

volumes:
  incidara-db:
